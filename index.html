<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DC-LM Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --green:#2E8B57; --deep:#1F6F45; --lime:#AACC00; --card:#F6FAF7; --amber:#C77700;
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#1B2A20; --muted:#5C6B61; --line:#D9E6DD; --hl:#FFF6DC; --red:#A23B2A;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1914; --surface:#162219; --ink:#E6F2EA; --muted:#9DB3A4; --line:#2A3D31; --card:#1B2B21; --deep:#7FD1A0; --green:#3FA56C; --hl:#3A3316; --amber:#E0A040; --red:#E58A78;
} }
:root[data-theme="dark"]{
  --bg:#0F1914; --surface:#162219; --ink:#E6F2EA; --muted:#9DB3A4; --line:#2A3D31; --card:#1B2B21; --deep:#7FD1A0; --green:#3FA56C; --hl:#3A3316; --amber:#E0A040; --red:#E58A78;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding:0 0 60px}
header.top{background:var(--bg);border-bottom:3px solid var(--lime);padding:14px 20px 10px;position:sticky;top:0;z-index:20}
.hdr-main{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
#hdr{display:block}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:40px;height:40px;border-radius:10px;background:var(--deep);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:20px}
.title{font-size:20px;font-weight:700;color:var(--deep);letter-spacing:.2px}
.sub{color:var(--muted);font-size:12px}
.hdr-right{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.field-inline{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.field-inline input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:150px}
.statusbar{margin-top:10px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:11px;letter-spacing:.6px}
.pill.ok{background:var(--green);color:#fff}
.pill.warn{background:var(--card);color:var(--amber);border:1px solid var(--amber)}
.meta{color:var(--muted);font-size:12px}
.meta b{color:var(--ink)}
.banner{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:13px;border-left:4px solid}
.banner.info{background:var(--card);border-color:var(--green)}
.banner.ok{background:#EEF8D9;border-color:var(--lime);color:var(--ink)}
.banner.err{background:#FBEAE6;border-color:var(--red);color:#7A2A1C}
.banner.warn{background:var(--card);border-color:var(--amber)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--green);background:var(--surface);color:var(--deep);padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--card)}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover{background:var(--deep)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.big{padding:12px 20px;font-size:15px;margin-top:10px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 20px 0}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--deep);padding:8px 14px;border-radius:999px;font-weight:600;cursor:pointer;font-size:13px}
.tab.on{background:var(--deep);color:var(--bg);border-color:var(--deep)}
main{padding:12px 20px}
.tabhead h1{font-size:18px;color:var(--deep);margin:6px 0 2px}
#filters{margin:10px 0}
.filterbar{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.frow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:8px}
.frow label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.frow label.grow{flex:1;min-width:260px}
.frow input,.frow select,.groupbar select{color-scheme:light dark;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;background:var(--surface);color:var(--ink);min-width:90px}
.frow input[type=search]{width:100%}
.frow input[type=number]{width:95px}
.chips{gap:6px}
.chipwrap{position:relative}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer}
.chip.on{background:var(--card);border-color:var(--green);color:var(--deep);font-weight:600}
.fpanel{position:absolute;top:34px;left:0;z-index:30;background:var(--surface);color:var(--ink);border:1px solid var(--green);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);width:300px;padding:8px}
.fsearch{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px}
.fbtns{display:flex;gap:6px;margin:6px 0}
.fbtns button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;color:var(--deep)}
.flist{max-height:260px;overflow:auto}
.fopt{display:flex;gap:6px;align-items:center;font-size:12px;padding:3px 2px;cursor:pointer;color:var(--ink)}
.fopt span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fopt em{font-style:normal;color:var(--muted)}
.fmore{font-size:11px;color:var(--muted);padding-top:4px}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.ch{margin-bottom:10px}
.ch h2,section.card h2{font-size:15px;margin:0 0 2px;color:var(--deep);padding-bottom:4px;border-bottom:3px double var(--lime)}
.ch .meta{margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:10px;padding:10px 12px}
.kpi.warn{border-left-color:var(--amber)}
.kl{font-size:12px;color:var(--muted)}
.kv{font-size:20px;font-weight:700;color:var(--deep);margin-top:2px}
.kv small{font-size:13px;color:var(--ink);font-weight:600}
.ks{font-size:11px;color:var(--muted);margin-top:2px}
.bars{display:flex;flex-direction:column;gap:5px}
.barrow{display:grid;grid-template-columns:110px 1fr 120px;gap:8px;align-items:center;font-size:12px}
.barrow .bl.wide{grid-column:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{background:var(--card);border:1px solid var(--line);border-radius:4px;height:12px;overflow:hidden}
.bt i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--lime))}
.bv{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.tablewrap{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:8px}
table.grid{border-collapse:collapse;width:100%;font-size:12.5px;background:var(--surface);color:var(--ink)}
table.grid th,table.grid td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
table.grid th{position:sticky;top:0;background:var(--card);color:var(--deep);font-weight:700;cursor:pointer;user-select:none;border-bottom:2px solid var(--green)}
table.grid td.num,table.grid th.num{text-align:right;font-variant-numeric:tabular-nums}
table.grid tr.click{cursor:pointer}
table.grid tr.click:hover td{background:var(--card)}
table.grid td.hl{background:var(--hl)}
td.empty{text-align:center;color:var(--muted);padding:14px}
.cat{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid}
.cat.confirm{background:#FFF9D6;color:#7A6400;border-color:#F2E38B}
:root[data-theme="dark"] .cat.confirm{color:#F2E38B;background:#3A3312}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .cat.confirm{color:#F2E38B;background:#3A3312} }
.cat.possible{background:var(--card);color:var(--amber);border-color:var(--amber)}
.cat.jit{background:var(--card);color:var(--deep);border-color:var(--green)}
.cat.none{background:var(--surface);color:var(--muted);border-color:var(--line)}
.catrow{display:flex;gap:8px;flex-wrap:wrap}
.flag{color:var(--amber);font-weight:700}
.groupbar{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.groupbar label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.exports{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
textarea.remark{width:240px;min-height:30px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;font:12px/1.3 inherit;font-family:inherit;resize:vertical}
textarea.remark.stale{border-color:var(--amber);background:var(--hl)}
textarea.remark{background:var(--surface);color:var(--ink)}
.rmeta{font-size:10px;color:var(--muted);margin-top:2px}
.diaggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;font-size:12px;margin-bottom:8px}
.diaggrid div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
.warn-text{color:var(--amber)}
.empty-state{text-align:center;padding:30px 16px}
.empty-state p{max-width:620px;margin:8px auto;color:var(--muted)}
#modal{display:none;position:fixed;inset:0;background:rgba(20,40,30,.35);z-index:50;padding:20px;overflow:auto}
#modal.show{display:block}
.modal{background:var(--surface);border-radius:12px;padding:16px;max-width:1200px;margin:0 auto;border-top:4px solid var(--lime)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mhead h3{margin:0;color:var(--deep)}
.mfoot{margin-top:10px}
@media (max-width:720px){
  header.top,main,nav.tabs{padding-left:16px;padding-right:16px}
  .field-inline input{width:110px}
  .barrow{grid-template-columns:90px 1fr 90px}
  .fpanel{width:calc(100vw - 64px)}
}

tr.selfhub td{background:#FFF1CC !important}
tr.selfhub td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
tr.flagrow td{background:#FCEFD9}
.zero{color:var(--line)}
.btn.small{padding:4px 9px;font-size:12px}
.tfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.hint{color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:8px}
.detailhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.detailhead h3{margin:0;color:var(--deep);font-size:15px}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin:8px 0}
.half h4{margin:6px 0;color:var(--deep);font-size:13px}
.subbox,.podbox{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:6px 0 10px;font-size:12px}
.subopt{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--ink)}
.podbox{max-height:120px;overflow:auto}

/* v3 additions: popup, resize handles, grand totals, lane tree */
:root{--laneBg:#E4F2C2;--laneInk:#1B2A20;--tertBg:#EEF6F0}
:root[data-theme="dark"]{--laneBg:#2A3510;--laneInk:#D9EE7A;--tertBg:#1B2B21}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--laneBg:#2A3510;--laneInk:#D9EE7A;--tertBg:#1B2B21} }
table.grid th .rz{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;border-right:2px solid transparent}
table.grid th .rz:hover{border-right-color:var(--lime)}
table.grid th{position:sticky;overflow:visible}
table.grid tr.totrow td{background:var(--card);font-weight:700;border-bottom:2px solid var(--green);color:var(--deep);cursor:default}
table.grid tr.lane-row td{background:var(--laneBg);color:var(--laneInk);font-weight:700}
table.grid tr.tert-row td{background:var(--tertBg);font-weight:600}
table.grid tr.dest-row td{font-weight:400}
.ind1{padding-left:14px;display:inline-block}
.ind2{padding-left:28px;display:inline-block}
.shortchip{display:inline-block;background:var(--amber);color:#fff;border-radius:999px;padding:0 7px;font-weight:700;font-size:11px}
.modal{max-width:1400px;width:100%}
.modal section.card{margin:10px 0;box-shadow:none}
.mhead{flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.mhead h2{margin:0;color:var(--deep);font-size:17px}
.mbtn{display:flex;gap:8px;flex-wrap:wrap}
.modal .tablewrap{max-height:55vh}
.frow select{min-width:110px}

/* v4: first-column cap, RCA boxes, width controls */
table.grid td.capfirst, table.grid th.capfirst{max-width:300px}
.metric{display:inline-flex;align-items:center;gap:6px}
.metric .seg{border:1px solid var(--line);background:var(--surface);color:var(--deep);padding:7px 12px;border-radius:999px;font-weight:600;cursor:pointer;font-size:12px}
.metric .seg.on{background:#1F6F45;color:#fff;border-color:#1F6F45}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .metric .seg.on{background:#AACC00;color:#0F1A00;border-color:#AACC00} }
:root[data-theme="dark"] .metric .seg.on{background:#AACC00;color:#0F1A00;border-color:#AACC00}
.cellw{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
table.grid td,table.grid th{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.grid td.rcacell{overflow:visible}
table.grid th{position:relative}
table.grid th{position:sticky;z-index:2}
table.grid th .rz{width:12px;z-index:5}
body.resizing{user-select:none;cursor:col-resize}
/* v5: left rail, collapsible sections, ageing-spike shading */
.shell{display:flex;align-items:flex-start;gap:0}
nav.side{flex:0 0 212px;position:sticky;top:84px;align-self:flex-start;display:flex;flex-direction:column;gap:6px;padding:16px 10px 16px 20px;border-right:1px solid var(--line);min-height:calc(100vh - 84px)}
nav.side .tab{width:100%;text-align:left;border-radius:9px;padding:11px 13px;font-size:13px;line-height:1.25;border:1px solid transparent;background:transparent;color:var(--deep)}
nav.side .tab:hover{background:var(--card)}
nav.side .tab.on{background:#1F6F45;color:#fff;border-color:#1F6F45;font-weight:700}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) nav.side .tab.on{background:#AACC00;color:#0F1A00;border-color:#AACC00} }
:root[data-theme="dark"] nav.side .tab.on{background:#AACC00;color:#0F1A00;border-color:#AACC00}
nav.side .railhead{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 13px 4px}
.shell main{flex:1;min-width:0}
section.card .ch{cursor:pointer;display:flex;align-items:flex-start;gap:10px}
section.card .ch h2{flex:1}
.caret{flex:0 0 auto;width:20px;height:20px;border-radius:6px;background:var(--card);color:var(--deep);font-size:11px;line-height:20px;text-align:center;font-weight:700}
section.card.closed .cbody{display:none}
section.card.closed{padding-bottom:10px}
section.card.closed .ch .meta{display:none}
.secbtns{display:flex;gap:8px;margin:0 0 10px}
/* ageing spike: pendency rising at a higher ageing than the one before it */
td.h1{background:#F1F8E6;color:#1F3310}
td.h2{background:#DCEEBB;color:#1A2C0C}
td.h3{background:#BFDD7A;color:#16250A;font-weight:600}
td.h4{background:#9ABF00;color:#0F1A00;font-weight:700}
td.spk1{box-shadow:inset 0 -3px 0 #2E8B57}
td.spk2{box-shadow:inset 0 -3px 0 #1F6F45;outline:2px solid #1F6F45;outline-offset:-2px}
.legend i.sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.08)}
.legend i.sw.h1{background:#F1F8E6}.legend i.sw.h2{background:#DCEEBB}
.legend i.sw.h3{background:#BFDD7A}.legend i.sw.h4{background:#9ABF00}
.legend i.sw.spk2{background:#fff;outline:2px solid #1F6F45;outline-offset:-2px}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) td.h1{background:#1C280C;color:#CFE6A4}
  :root:not([data-theme="light"]) td.h2{background:#2A3B10;color:#DCEFB4}
  :root:not([data-theme="light"]) td.h3{background:#44600F;color:#EDF8D6}
  :root:not([data-theme="light"]) td.h4{background:#7FA300;color:#0F1A00}
  :root:not([data-theme="light"]) td.spk1{box-shadow:inset 0 -3px 0 #AACC00}
  :root:not([data-theme="light"]) td.spk2{box-shadow:inset 0 -3px 0 #AACC00;outline-color:#AACC00}
}
:root[data-theme="dark"] td.h1{background:#1C280C;color:#CFE6A4}
:root[data-theme="dark"] td.h2{background:#2A3B10;color:#DCEFB4}
:root[data-theme="dark"] td.h3{background:#44600F;color:#EDF8D6}
:root[data-theme="dark"] td.h4{background:#7FA300;color:#0F1A00}
:root[data-theme="dark"] td.spk1{box-shadow:inset 0 -3px 0 #AACC00}
:root[data-theme="dark"] td.spk2{box-shadow:inset 0 -3px 0 #AACC00;outline-color:#AACC00}
.legend{display:inline-flex;align-items:center;gap:6px;margin-left:10px;font-size:11px;color:var(--muted)}
.legend i{width:13px;height:13px;border-radius:3px;display:inline-block}
@media (max-width:900px){
  .shell{flex-direction:column}
  nav.side{flex:none;width:100%;flex-direction:row;flex-wrap:wrap;position:static;min-height:0;border-right:0;border-bottom:1px solid var(--line);padding:10px 16px}
  nav.side .tab{width:auto}
  nav.side .railhead{display:none}
}
.backendbox{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.backendbox label{display:flex;flex-direction:column;gap:4px;flex:1;min-width:280px;font-size:12px;color:var(--muted)}
.backendbox input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--bg);color:var(--ink)}
.backendbox .meta{flex-basis:100%}
table.grid tr.lanetop td{background:#FFFBEA}
table.grid tr.lanetop td:first-child{box-shadow:inset 3px 0 0 #F2E38B}
:root[data-theme="dark"] table.grid tr.lanetop td{background:#3A3312}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) table.grid tr.lanetop td{background:#3A3312} }
.rank{display:inline-block;background:var(--deep);color:#fff;border-radius:999px;padding:0 7px;font-size:10.5px;font-weight:700}
body.resizing table.grid th{cursor:col-resize}
textarea.remark.rca{width:170px;min-height:26px;font-size:11.5px}
td.rcacell{white-space:normal}
.btn.small.ghost{border-color:var(--line);color:var(--muted)}
table.grid tr.totrow td:first-child{color:var(--deep)}
.subbox input[type=radio]{accent-color:var(--green)}

/* ============ Shadowfax Pendency Dashboard skin (matches Network Pendency Review) ============ */
:root{
  --green:#157F5F; --deep:#0F5132; --lime:#C4D82E; --card:#FFFFFF; --amber:#B06A00;
  --bg:#F6F8F7; --surface:#FFFFFF; --ink:#13241C; --muted:#64756B; --line:#E3E8E6; --hl:#FFF6DC; --red:#A23B2A;
  --rail:#FFFFFF; --chip:#FFFFFF; --thead:#FAFBFA;
  --heat1:#E8F5EF; --heat2:#CDEADD; --heat3:#A5D9C4; --heat4:#5FBD9B;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --green:#4FC79D; --deep:#A7E8CC; --lime:#C4D82E; --card:#16211C; --bg:#0E1714; --surface:#16211C;
  --ink:#E7F2EC; --muted:#9AB0A5; --line:#25362E; --rail:#111B17; --chip:#16211C; --thead:#13201A;
  --heat1:#15291F; --heat2:#1D3A2B; --heat3:#2C5A42; --heat4:#3E8763;
}}
:root[data-theme="dark"]{
  --green:#4FC79D; --deep:#A7E8CC; --lime:#C4D82E; --card:#16211C; --bg:#0E1714; --surface:#16211C;
  --ink:#E7F2EC; --muted:#9AB0A5; --line:#25362E; --rail:#111B17; --chip:#16211C; --thead:#13201A;
  --heat1:#15291F; --heat2:#1D3A2B; --heat3:#2C5A42; --heat4:#3E8763;
}
html,body{background:var(--bg);color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-feature-settings:'cv11','ss01';-webkit-font-smoothing:antialiased}
table.grid td.num,table.grid th.num,.kv,.bv{font-variant-numeric:tabular-nums}

/* header */
header.top{background:var(--surface);border-bottom:3px solid var(--lime);padding:18px 0 0}
#hdr{padding:0 30px}
.hdr-main{align-items:flex-start;gap:20px}
.brand{align-items:flex-start;gap:14px}
.logo{display:none}
.title{font-size:34px;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.1}
.title::before{content:'SHADOWFAX · NETWORK PENDENCY REVIEW';display:block;
  font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--green);margin-bottom:7px}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.hdr-right{gap:10px;align-items:center;padding-top:6px}
.statusbar{padding:14px 30px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{border-radius:999px;padding:5px 13px;font-size:11px;font-weight:700;letter-spacing:.06em}
.pill.ok{background:#E8F5EF;color:#0F5132}
.pill.warn{background:#FDF2DC;color:#8A5A00}
.statusbar .meta{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:12.5px;color:var(--muted)}
.statusbar .meta b{color:var(--ink);font-weight:700}
.banner{margin:0 30px 12px;border-radius:10px;font-size:13px}

/* buttons */
.btn{border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-weight:600;font-size:13px;padding:9px 15px;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--green);background:var(--surface)}
.btn.primary{background:var(--deep);border-color:var(--deep);color:#fff}
.btn.primary:hover{background:#0B3F27;border-color:#0B3F27}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.small{padding:6px 11px;font-size:12px;border-radius:8px}

/* left rail */
.shell{gap:0;background:var(--bg)}
nav.side{flex:0 0 244px;background:var(--rail);border-right:1px solid var(--line);padding:22px 14px;gap:4px;top:0;min-height:calc(100vh - 60px)}
nav.side .railhead{font-size:10.5px;font-weight:700;letter-spacing:.13em;color:var(--muted);padding:4px 12px 8px}
nav.side .tab{border-radius:10px;padding:12px 14px;font-size:13.5px;font-weight:600;color:var(--ink);border:1px solid transparent}
nav.side .tab:hover{background:var(--bg)}
nav.side .tab.on{background:var(--deep);color:#fff;border-color:var(--deep);box-shadow:0 1px 2px rgba(0,0,0,.08)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) nav.side .tab.on{background:#1C6B4D;color:#EAF7F0;border-color:#1C6B4D} }
:root[data-theme="dark"] nav.side .tab.on{background:#1C6B4D;color:#EAF7F0;border-color:#1C6B4D}
.shell main{padding:0 30px 50px}

/* filters */
.filterbar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:22px 0 20px}
.frow{gap:12px 14px;align-items:flex-end}
.frow label{font-size:11px;font-weight:600;color:var(--muted);gap:5px}
.frow input,.frow select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;background:var(--surface);color:var(--ink);font-family:inherit}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--ink)}
.chip:hover{border-color:var(--green)}
.chip.on{border-color:var(--deep);background:#E8F5EF;color:var(--deep)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip.on{background:#19392C;color:#A7E8CC} }
:root[data-theme="dark"] .chip.on{background:#19392C;color:#A7E8CC}

/* cards */
section.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin:0 0 18px;box-shadow:none}
section.card .ch h2,section.card h2{font-size:21px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
section.card .ch{gap:12px;align-items:center;margin-bottom:4px}
section.card .ch .meta,section.card .cbody>.meta{color:var(--muted);font-size:13px;margin-bottom:14px}
.caret{background:var(--bg);color:var(--green);border:1px solid var(--line)}
.tabhead h1{font-size:25px;font-weight:700;letter-spacing:-.015em;color:var(--ink);margin:26px 0 6px}
.tabhead .meta{color:var(--muted);font-size:13px}

/* KPI strip */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kl{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--muted);text-transform:none}
.kv{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.ks{font-size:11.5px;color:var(--muted)}

/* tables */
.tablewrap{border:1px solid var(--line);border-radius:12px}
table.grid{font-size:13px}
table.grid th{background:var(--thead);color:var(--muted);font-weight:600;font-size:11.5px;
  letter-spacing:.03em;padding:11px 12px;border-bottom:1px solid var(--line)}
table.grid td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink)}
table.grid tbody tr:last-child td{border-bottom:0}
table.grid tr.click:hover td{background:#F2F8F5}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) table.grid tr.click:hover td{background:#1A2A22} }
:root[data-theme="dark"] table.grid tr.click:hover td{background:#1A2A22}
table.grid tr.totrow td{background:var(--thead);color:var(--ink);border-bottom:2px solid var(--green);font-weight:700}
.zero{color:#C3CEC8}

/* heat scale, teal-green like the reference */
td.h1{background:var(--heat1);color:var(--ink)}
td.h2{background:var(--heat2);color:#0F2B20}
td.h3{background:var(--heat3);color:#0C2419;font-weight:600}
td.h4{background:var(--heat4);color:#06180F;font-weight:700}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  td.h2{color:#CFEADD} td.h3{color:#E4F5EC} td.h4{color:#07150F} }}
:root[data-theme="dark"] td.h2{color:#CFEADD}
:root[data-theme="dark"] td.h3{color:#E4F5EC}
:root[data-theme="dark"] td.h4{color:#07150F}
td.spk1{box-shadow:inset 0 -3px 0 var(--green)}
td.spk2{box-shadow:inset 0 -3px 0 var(--deep);outline:2px solid var(--deep);outline-offset:-2px}
.legend i.sw.h1{background:var(--heat1)}.legend i.sw.h2{background:var(--heat2)}
.legend i.sw.h3{background:var(--heat3)}.legend i.sw.h4{background:var(--heat4)}
.legend i.sw.spk2{outline-color:var(--deep)}

/* per-table metric selector under the heading */
.tmetric{display:flex;align-items:center;gap:7px;margin:0 0 12px}
.tmetric .seg{border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:6px 13px;border-radius:999px;font-weight:600;cursor:pointer;font-size:12px;font-family:inherit}
.tmetric .seg.on{background:var(--deep);color:#fff;border-color:var(--deep)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tmetric .seg.on{background:#1C6B4D;color:#EAF7F0;border-color:#1C6B4D} }
:root[data-theme="dark"] .tmetric .seg.on{background:#1C6B4D;color:#EAF7F0;border-color:#1C6B4D}
.subbox{gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.subopt{font-size:12.5px;color:var(--ink)}

/* field list panel */
.fieldlist{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0}
.fieldgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 18px;margin-top:12px}
.fieldgrid span{font-size:12.5px;color:var(--ink);padding:3px 0;border-bottom:1px dotted var(--line)}
.fieldgrid span i{color:var(--muted);font-style:normal;margin-right:7px;font-variant-numeric:tabular-nums}
/* action-item severity */
.sev{display:inline-block;border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:700}
.sev.t{background:#F8D7D2;color:#7A2318}
.sev.w{background:#FDF0D5;color:#7A5200}
.sev.v{background:#E8F5EF;color:#0F5132}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  .sev.t{background:#4A1A13;color:#F6C7BF} .sev.w{background:#43340C;color:#F2DEA8} .sev.v{background:#17382A;color:#A7E8CC} }}
:root[data-theme="dark"] .sev.t{background:#4A1A13;color:#F6C7BF}
:root[data-theme="dark"] .sev.w{background:#43340C;color:#F2DEA8}
:root[data-theme="dark"] .sev.v{background:#17382A;color:#A7E8CC}

/* ---- tighter type scale (table text ~10px, like an Excel sheet) ---- */
html,body{font-size:13px}
.title{font-size:27px}
.title::before{font-size:9.5px;letter-spacing:.13em}
.sub{font-size:11.5px}
.statusbar .meta{font-size:11px;padding:5px 12px}
.pill{font-size:10px;padding:4px 11px}
.btn{font-size:11.5px;padding:7px 12px}
.btn.small{font-size:10.5px;padding:5px 9px}
nav.side .tab{font-size:12px;padding:10px 12px}
nav.side .railhead{font-size:9.5px}
.tabhead h1{font-size:20px;margin:20px 0 5px}
.tabhead .meta,.meta{font-size:11px}
section.card{padding:16px 18px;margin-bottom:14px}
section.card .ch h2,section.card h2{font-size:15.5px}
.kpi{padding:12px 14px}
.kl{font-size:9.5px}.kv{font-size:21px}.ks{font-size:10px}
.frow label{font-size:9.5px}
.frow input,.frow select{font-size:11.5px;padding:7px 9px}
.chip{font-size:11px;padding:7px 11px}
.fopt,.subopt{font-size:11px}
.tmetric .seg{font-size:10.5px;padding:5px 11px}
table.grid{font-size:10.5px}
table.grid th{font-size:9.5px;padding:7px 9px;letter-spacing:.02em}
table.grid td{padding:5px 9px}
textarea.remark.rca{font-size:10px;width:150px;min-height:22px}
.sev{font-size:10px;padding:2px 9px}
.fieldgrid span{font-size:11px}

/* ---- PivotTable Fields panel ---- */
.pvpanel{position:fixed;top:0;right:0;width:390px;height:100vh;overflow:auto;z-index:40;
  background:var(--surface);border-left:1px solid var(--line);box-shadow:-6px 0 22px rgba(0,0,0,.10);padding:16px 18px 24px}
.pvhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pvhead h2{font-size:17px;font-weight:700;color:var(--ink);margin:0}
.pvx{border:0;background:transparent;font-size:21px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:7px}
.pvx:hover{background:var(--bg);color:var(--ink)}
.pvlbl{display:block;font-size:11px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.pvsel,.pvsearch{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11.5px;
  background:var(--surface);color:var(--ink);font-family:inherit}
.pvfields{border:1px solid var(--line);border-radius:8px;max-height:190px;overflow:auto;margin-top:8px;padding:5px 0}
.pvf{display:flex;align-items:center;gap:8px;padding:5px 11px;font-size:11.5px;color:var(--ink);cursor:pointer}
.pvf:hover{background:var(--bg)}
.pvf input{accent-color:var(--deep)}
.pvareas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.pvarea{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px;min-height:92px}
.pvat{font-size:9.5px;font-weight:700;letter-spacing:.09em;color:var(--muted);margin-bottom:7px}
.pvempty{font-size:10px;color:var(--muted);line-height:1.45}
.pvchip{display:flex;align-items:center;gap:3px;background:var(--surface);border:1px solid var(--line);
  border-radius:7px;padding:4px 5px 4px 8px;margin-bottom:5px;font-size:10.5px}
.pvchip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.pvchip button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:10px;padding:2px 3px;border-radius:4px;line-height:1}
.pvchip button:hover{background:var(--bg);color:var(--ink)}
.pvfoot{display:flex;gap:8px;margin-top:16px}
.pvfoot .btn{flex:1}
.shell.pvopen main{padding-right:406px}
.locpick{max-height:124px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
@media (max-width:1100px){ .pvpanel{width:100%;left:0} .shell.pvopen main{padding-right:30px} }

/* ---- pivot panel sits in the corner without taking the page ---- */
.pvpanel{width:328px;padding:14px 14px 20px}
.pvpanel .pvareas{grid-template-columns:1fr 1fr;gap:8px}
.pvpanel .pvarea{min-height:78px;padding:7px}
.pvfields{max-height:168px}
.shell.pvopen main{padding-right:344px}
/* the panel is docked, so the header must give it room instead of sitting under it */
body.pvopen header.top{padding-right:328px}
@media (max-width:1180px){ .pvpanel{width:300px} .shell.pvopen main{padding-right:316px} body.pvopen header.top{padding-right:300px} }
@media (max-width:900px){ .pvpanel{width:100%} .shell.pvopen main{padding-right:16px} body.pvopen header.top{padding-right:0} }

/* ---- per-table toolbar, top right ---- */
.ttools{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin:0 0 8px}
.ttools .meta{margin-right:auto;font-size:10px}
.tfoot{display:none}

/* ---- grouped header + RCA note in the lane popup ---- */
table.grid th.grp{text-align:center;background:var(--heat1);color:var(--deep);font-weight:700;letter-spacing:.04em;border-left:1px solid var(--line)}
table.grid.tree th{position:static}
.rcanote{background:var(--heat1);border-left:3px solid var(--green);border-radius:8px;
  padding:10px 13px;margin-bottom:12px;font-size:11.5px;line-height:1.55;color:var(--ink)}
</style>
</head>
<body>
<header class="top"><div id="hdr"></div></header>
<div class="shell">
  <nav class="side" id="nav"></nav>
  <main>
    <div id="filters"></div>
    <div id="body"></div>
  </main>
</div>
<div id="modal"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* Shadowfax Visibility Dashboard - classification and analytics engine (pure logic, no DOM). */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) { module.exports = api; }
  else { root.VIS = api; }
})(typeof self !== 'undefined' ? self : globalThis, function () {
  'use strict';

  // ---------- Configuration (all business thresholds live here) ----------
  var CONFIG = {
    sheetPriority: ['Base', 'Short_Dispatched'],
    tabs: {
      overall: { label: 'DCH Overall Pendency', manifestType: 'DCH2',  ageMin: null, ageMax: null },
      fwd:  { label: 'Forward Short Shipment Pendency', manifestType: 'ALL', ageMin: null, ageMax: null },
      mm:   { label: 'MM Liability',        manifestType: 'DCH2',  ageMin: null, ageMax: null },
      lh:   { label: 'LH Liability',        manifestType: 'DCH2',  ageMin: null, ageMax: null },
      lm:   { label: 'LM Liability',        manifestType: 'DCH2',  ageMin: null, ageMax: null },
      dcdc: { label: 'DC-DC Short',         manifestType: 'DC-DC', ageMin: null, ageMax: null }
    },
    laneValueThreshold: 30000,   // lane exposure strictly greater than this is flagged
    hovValueThreshold: 5000,     // HOV list threshold, strictly greater than
    olderAgeingDays: 10,         // "older pending" tag for DC-DC criticality (assumption)
    minLaneAwbs: 10,             // minimum lane pendency before a pattern is called (assumption)
    confirmMinValidated: 5,      // Confirm Lane Issue needs at least this many validated shorts in the lane
    confirmHighlightTop: 10,     // top lanes by pendency stay 'Confirm Lane Issue'
    confirmShowMax: 30,          // nothing beyond this rank is flagged at all
    jitShareThreshold: 0.6,      // Connecting Bagging share for Possible JIT/ADC (assumption)
    jitMinBagAwbs: 5,            // minimum AWBs in the dominant bagging (assumption)
    // JIT/ADC concentration also requires >= 2 distinct Connecting Bagging values on the lane (a single-bagging lane is not 'concentrated')
    tertiaryDominanceShare: 0.6, // share of tertiary-tagged pendency for a dominant tertiary lane (assumption)
    broadMinDestinations: 3,     // Possible Lane Issue: destinations spread (assumption)
    broadMaxTopDestShare: 0.5,   // ...and no single destination above this share (assumption)
    retentionHours: 24,
    sellerMinAwbs: 5,            // DC-DC seller flag: minimum pendency (assumption)
    sellerFraudValue: 50000,     // DC-DC seller flag: value that marks a liquid-damage seller as high criticality (assumption)
    sellerAgedDays: 10,          // DC-DC spike: ageing from which pendency counts as aged (assumption)
    sellerAgedShare: 0.6,        // DC-DC spike: share of seller pendency that is aged (assumption)
    hov2ValueThreshold: 2000,    // DC-DC HOV description list threshold (per DC-DC table 3)
    liquidDamageRegex: /\b(ghar|beco)\b/i,
    criticalAgeDays: 10          // LM >5k criticality: Critical if value > 5k and ageing >= this (assumption)
  };

  // Source header -> canonical field. optional=true means missing header is reported but not fatal.
  var FIELD_MAP = [
    ['awb', 'Awb_number'], ['manifestType', 'Manifest_Type'], ['ageing', 'Ageing_from_Bag_Rec'],
    ['currentLocation', 'Current_location'], ['laneCode', 'Lane Code'], ['tertiaryLane', 'Tertiary Lane'],
    ['connectingBagging', 'Connecting Bagging'], ['manifestOrigin', 'Manifest_origin'],
    ['manifestDestination', 'Manifest_Destination'], ['manifestCode', 'Manifest_code'],
    ['actualManifestId', 'ActualManifestID', true], ['mmRemarks', 'MM Remarks'], ['lmRemarks', 'LM Remarks'],
    ['landroval', 'Landroval Check'], ['hov', 'HOV'], ['wrongDestination', 'Wrongly Connceted Destination', true],
    ['productName', 'product_names', true], ['productCategory', 'product_categories', true],
    ['pod', 'POD Mapping', true], ['podZone', 'POD_Zone', true], ['seller', 'seller_name', true], ['hov2', 'HOV2', true],
    ['shipInManifest', 'Shipment in Manifest', true], ['dcRemark', 'Remarks', true],
    ['awbInManifest', 'awbs_in_manifest', true], ['actionUser', 'action_user', true],
    ['region', 'Current_Location_Region', true],
    ['lastActionUser', 'last_action_user', true], ['pendencyCount', 'Pendency Count', true]
  ];
  var VALUE_HEADERS = ['Product_Value2', 'product_value'];

  // ---------- Normalisation ----------
  var NA = new Set(['', 'na', 'n/a', '#n/a', 'nan', 'null', 'none', 'nil', '-', '#value!', '#ref!']);
  function txt(v) { return v === null || v === undefined ? '' : String(v).trim(); }
  function isMissing(v) { return NA.has(txt(v).toLowerCase()); }
  function isMissingCode(v) { return isMissing(v) || txt(v) === '0'; }
  function norm(v) { return txt(v).replace(/\s+/g, ' ').replace(/\s*@\s*/g, '@').toLowerCase(); }
  function toNum(v) {
    if (v === null || v === undefined || v === '') return null;
    var n = Number(String(v).replace(/,/g, '').trim());
    return isFinite(n) ? n : null;
  }
  function normMT(v) {
    var k = txt(v).toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (k === 'DCH2') return 'DCH2';
    if (k === 'DCDC') return 'DC-DC';
    return txt(v);
  }
  var BUCKETS = ['1', '2–5', '6–10', '11–15', '16–20', '21–25', '26–30', '31+'];
  function ageBucket(a) {
    if (a === null || a === undefined) return '(no ageing)';
    if (a <= 1) return '1'; if (a <= 5) return '2–5'; if (a <= 10) return '6–10';
    if (a <= 15) return '11–15'; if (a <= 20) return '16–20'; if (a <= 25) return '21–25';
    if (a <= 30) return '26–30'; return '31+';
  }

  // Ageing band: every day up to AGE_BAND_MAX on its own, everything beyond it summed as "20+".
  var AGE_BAND_MAX = 20;
  function ageBand(a) {
    if (a === null || a === undefined) return '(blank)';
    return a > AGE_BAND_MAX ? (AGE_BAND_MAX + '+') : String(a);
  }

  // ---------- Collated remark buckets (MM Remarks + Landroval Check, and LM Remarks) ----------
  function nrm(v) { return txt(v).toLowerCase().replace(/\s+/g, ' ').trim(); }

  var CB_CCTV = ['dvr issue', 'camera not aligned', 'camera not clear', 'camera not found'];
  var CB_DCXD = ['shipment connected to wrong destination', 'miss sort - gc fault (not connected in manifest)',
                 'fake bagging', 'potential miss from site'];
  var CB_SEAL = ['seal mismatch @origin', 'gc created 2 bags for same manifest'];
  var CB_REPORT = ['landroval data not found', 'rec at hub/delivered'];
  var CB_LAND_OK = ['connected correctly', 'brsnr pendency'];
  var CB_LAND_SEAL = ['seal mismatch', 'possible seal mismatch'];

  function inList(list, v) { return list.indexOf(v) >= 0; }

  // MM collated bucket: the MM remark decides, with Landroval Check resolving the CCTV cases.
  function mmCollated(mmRemark, landroval) {
    var m = nrm(mmRemark), l = nrm(landroval);
    var blankM = m === '' || m === '0' || m === '#n/a' || m === 'na' || m === 'n/a';
    if (!blankM) {
      if (m === 'shipment connected to correct destination') return 'Connected correctly';
      if (inList(CB_CCTV, m)) {
        if (inList(CB_LAND_OK, l)) return 'Connected correctly';
        if (inList(CB_LAND_SEAL, l)) return 'Seal mismatch';
        return 'CCTV issue';
      }
      if (inList(CB_SEAL, m)) return 'Seal mismatch';
      if (inList(CB_DCXD, m)) return 'DC/XD miss';
      if (inList(CB_REPORT, m)) return 'Report issue';
      if (m === 'sdd shipment' || m === 'sdd') return 'SDD';
      if (m.indexOf('duplicate ptl') === 0) return 'Duplicate PTL / Manual station';
    }
    // Nothing usable in the MM remark: fall back to Landroval, else it is still to be worked.
    if (inList(CB_LAND_OK, l)) return 'Connected correctly';
    if (inList(CB_LAND_SEAL, l)) return 'Seal mismatch';
    return 'WIP';
  }

  var CB_LM_SHORT = ['short found', 'short validated', 'approved'];
  var CB_LM_CCTV = ['backup gap', 'backup issue', 'camera issues', 'camera issue', 'no footage found', 'offline', 'time mismatch'];
  var CB_LM_EXCESS = ['excess', 'no short found', 'no short'];
  var CB_LM_PROCESS = ['process breach ( multiple bagging / debagging )', 'process breach',
                    'no bagging / debagging at the given time', 'no debagging at the given time',
                    'multiple bagging at the given time'];

  function lmCollated(lmRemark) {
    var v = nrm(lmRemark);
    if (v === '' || v === '0' || v === '#n/a' || v === 'na' || v === 'n/a') return 'WIP';
    if (inList(CB_LM_SHORT, v)) return 'Short found';
    if (inList(CB_LM_CCTV, v)) return 'CCTV issue';
    if (inList(CB_LM_EXCESS, v)) return 'Excess / No short found';
    if (inList(CB_LM_PROCESS, v)) return 'Process breach';
    if (v === 'rejected') return 'Rejected';

  // ---------- Remark dictionaries (keys are normalised) ----------
  var MM_DIRECT = {};
  MM_DIRECT[norm('Seal Mismatch @Origin')] = { reason: 'Seal mismatch @ origin', rule: 'MM-D1' };
  MM_DIRECT[norm('Shipment Connected to Wrong Destination')] = { reason: 'Shipment connected to wrong destination', rule: 'MM-D2' };
  MM_DIRECT[norm('Fake bagging')] = { reason: 'Fake bagging', rule: 'MM-D3' };
  MM_DIRECT[norm('Miss Sort - GC Fault (Not Connected in Manifest)')] = { reason: 'Miss sort GC fault', rule: 'MM-D4' };
  MM_DIRECT[norm('GC created 2 Bags for Same manifest')] = { reason: 'GC created 2 bags for same manifest', rule: 'MM-D5' };
  var MM_CCTV = {};
  MM_CCTV[norm('Camera Not Clear')] = { reason: 'Camera not clear', rule: 'MM-C1' };
  MM_CCTV[norm('DVR Issue')] = { reason: 'DVR issue', rule: 'MM-C2' };
  MM_CCTV[norm('Camera Not Aligned')] = { reason: 'Camera not aligned', rule: 'MM-C3' };
  MM_CCTV[norm('Duplicate PTL/Manual Station')] = { reason: 'Duplicate PTL', rule: 'MM-C4' };

  // ---------- Record normalisation ----------
  function resolveHeaders(headers, aoaRows) {
    var idx = {}, missing = [], optionalMissing = [];

      awb: txt(g('awb')),
      mt: normMT(g('manifestType')),
      age: toNum(g('ageing')),
      loc: txt(g('currentLocation')),
      lane: isMissingCode(g('laneCode')) ? '' : txt(g('laneCode')),
      tert: isMissing(g('tertiaryLane')) ? '' : txt(g('tertiaryLane')),
      bag: isMissingCode(g('connectingBagging')) ? '' : txt(g('connectingBagging')),
      origin: txt(g('manifestOrigin')),
      dest: txt(g('manifestDestination')),
      mcode: txt(g('manifestCode')),
      amid: isMissingCode(g('actualManifestId')) ? '' : txt(g('actualManifestId')),
      mm: txt(g('mmRemarks')),
      lm: txt(g('lmRemarks')),
      land: txt(g('landroval')),
      hov: norm(g('hov')) === 'hov',
      wrongDest: isMissingCode(g('wrongDestination')) ? '' : txt(g('wrongDestination')),
      pname: isMissingCode(g('productName')) ? '' : txt(g('productName')),
      pcat: isMissingCode(g('productCategory')) ? '' : txt(g('productCategory')),
      pod: txt(g('pod')) || 'NA',
      podZone: txt(g('podZone')) || 'NA',
      seller: txt(g('seller')) || 'NA',
      hov2: norm(g('hov2')) === 'hov',
      shipInManifest: manifestCount(g('shipInManifest'), g('awbInManifest')),
      actionUser: isMissingCode(g('actionUser')) ? '' : txt(g('actionUser')),
      region: isMissingCode(g('region')) ? '' : txt(g('region')),
      dcRemark: isMissing(g('dcRemark')) ? 'NA' : txt(g('dcRemark')),
      mmColl: mmCollated(g('mmRemarks'), g('landroval')),

  // ---------- Classification ----------
  var BUCKET_SEAL = 'Seal mismatch', BUCKET_MISROUTE = 'DC/XD misroute/ fake bagging', BUCKET_CCTV = 'CCTV issue at DC- Short at Hub';
  function setMM(rec, cls, reason, rule, note, bucket) { rec.mmCls = cls; rec.mmReason = reason; rec.mmRule = rule; rec.mmNote = note || ''; rec.mmBucket = bucket || ''; return rec; }

  function classifyMM(rec) {
    var m = norm(rec.mm), land = norm(rec.land);

    var d = MM_DIRECT[m];

      }
      // CCTV remark (not duplicate PTL) with LM short found/approved: MM liability, Landroval seal mismatch takes precedence above.
      if (c && c.rule !== 'MM-C4' && rec.lmShort) {
        return setMM(rec, 'MM', label + ' + LM ' + rec.lm, c.rule + '-LM', '', BUCKET_CCTV);
      }
      if (land === 'connected correctly') {

      }
      return setMM(rec, 'REVIEW', label + ': Landroval ' + (rec.land ? 'inconclusive ("' + rec.land + '")' : 'missing'), 'REV-LAND', '');

  }

  function lmClass(rec) {
    if (rec.mmCls === 'MM') return 'EXCLUDED_MM';
    if (rec.lmShort) return 'EXCLUDED_LM_SHORT';
    if (rec.mmCls === 'REVIEW' && rec.lmBlank) return 'REVIEW';
    return 'LM_LIABILITY';
  }

  function classifyRecord(rec) {
    // Datasets cached before the collated buckets existed carry no mmColl/lmColl.
    // Rebuild them from the raw remarks the record already stores, so nothing renders as undefined.
    if (rec.mmColl === undefined || rec.mmColl === null) rec.mmColl = mmCollated(rec.mm, rec.land);
    if (rec.lmColl === undefined || rec.lmColl === null) rec.lmColl = lmCollated(rec.lm);
    rec.lmShort = LM_SHORT.has(norm(rec.lm));
    rec.lmBlank = isMissing(rec.lm);
    classifyMM(rec);
    rec.lmCls = lmClass(rec);
    return rec;
  }

  // ---------- Dataset build ----------
  function buildDataset(headers, aoaRows, sheetName) {
    var res = resolveHeaders(headers, aoaRows);
    if (!res.ok) return { ok: false, missing: res.missing, errors: ['Missing required column(s): ' + res.missing.join(', ')] };
    var records = [], blankAwb = 0, awbCount = new Map();
    aoaRows.forEach(function (row, i) {
      if (!row || row.every(function (c) { return c === null || c === undefined || c === ''; })) return;
      var rec = buildRecord(row, res.idx, i + 2);
      if (!rec.awb) { blankAwb++; return; }

      records.push(rec);
      awbCount.set(rec.awb, (awbCount.get(rec.awb) || 0) + 1);
    });
    var dupAwbs = []; awbCount.forEach(function (n, k) { if (n > 1) dupAwbs.push([k, n]); });
    var diag = {

      uniqueAwb: awbCount.size, duplicateAwbs: dupAwbs.length, duplicateRowsExtra: dupAwbs.reduce(function (s, d) { return s + d[1] - 1; }, 0),
      duplicateSample: dupAwbs.slice(0, 20), valueHeader: res.valueHeader, optionalMissing: res.optionalMissing,
      missingAgeing: records.filter(function (r) { return r.age === null; }).length,
      invalidValue: records.filter(function (r) { return !r.valueOk; }).length,
      unmappedLane: records.filter(function (r) { return r.lane === ''; }).length,
      manifestTypes: countBy(records, function (r) { return r.mt; })
    };
    return { ok: true, records: records, headers: headers, diagnostics: diag, warnings: res.optionalMissing };
  }

  // ---------- Population / tab logic ----------
  function population(records, tab, f) {
    var cfg = CONFIG.tabs[tab];
    var mt = (f && f.manifestType) ? f.manifestType : cfg.manifestType;
    var lo = (f && f.ageMin !== undefined && f.ageMin !== null) ? f.ageMin : cfg.ageMin;
    var hi = (f && f.ageMax !== undefined && f.ageMax !== null) ? f.ageMax : cfg.ageMax;
    return records.filter(function (r) {
      if (!(mt === 'ALL' || r.mt === mt)) return false;
      if (r.age === null) return lo === null && hi === null;   // unaged rows show only when no bound is set
      if (lo !== null && r.age < lo) return false;
      if (hi !== null && r.age > hi) return false;
      return true;
    });
  }

  // Liability / analysis rows for each tab
  function tabRows(records, tab, f) {
    var pop = population(records, tab, f);
    switch (tab) {
      case 'mm': return pop.filter(function (r) { return r.mmCls === 'MM'; });
      // LH: MM liability removed, except the CCTV issue at DC / short at LM bucket, which stays in lanes.
      case 'lh': return pop.filter(function (r) { return (r.mmCls !== 'MM' || r.mmBucket === 'CCTV issue at DC- Short at Hub') && r.lane !== ''; });
      case 'lm': return pop.filter(function (r) { return r.lmCls === 'LM_LIABILITY'; });
      case 'dcdc': return pop;
      case 'overall': return pop;
      case 'fwd': return pop;
    }
    return [];
  }

  // Records that need human review on each tab (never forced into a liability)
  function reviewRows(records, tab, f) {
    var pop = population(records, tab, f);
    switch (tab) {
      case 'mm': return pop.filter(function (r) { return r.mmCls === 'REVIEW'; });
      case 'lh': return pop.filter(function (r) { return r.mmCls !== 'MM' && (r.mmCls === 'REVIEW' || r.lane === ''); });
      case 'lm': return pop.filter(function (r) { return r.lmCls === 'REVIEW' || (r.lmCls === 'LM_LIABILITY' && r.mmCls === 'REVIEW'); });
      case 'dcdc': return pop.filter(function (r) { return !r.origin || !r.dest || !r.valueOk; });
      case 'overall': return pop.filter(function (r) { return !r.loc; });
      case 'fwd': return pop.filter(function (r) { return !r.loc; });
    }
    return [];
  }

  function reviewReason(r, tab) {
    if (tab === 'mm') return r.mmReason;
    if (tab === 'lh') return r.mmCls === 'REVIEW' ? r.mmReason : (r.lane === '' ? 'Lane Code missing or 0' : '');
    if (tab === 'lm') return r.mmCls === 'REVIEW' ? r.mmReason : '';
    if (tab === 'dcdc') return [!r.origin ? 'Origin blank' : '', !r.dest ? 'Destination blank' : '', !r.valueOk ? 'Product_Value2 not numeric' : ''].filter(Boolean).join('; ');
    return '';
  }

  // ---------- Pivot / aggregation ----------
  // Readable labels for the LM classification, so LM Remarks can be shown bucketised everywhere.
  var LM_LABEL = {
    EXCLUDED_MM: 'MM liability (not LM)',
    EXCLUDED_LM_SHORT: 'LM short validated',
    REVIEW: 'Needs review',
    LM_LIABILITY: 'LM liability'
  };
  function lmBucket(r) { return LM_LABEL[r.lmCls] || r.lmCls || 'Needs review'; }
  function mmBucketOf(r) { return r.mmBucket || (r.mmCls === 'REVIEW' ? 'Needs review' : 'Not MM liability'); }

  var KEYS = {
    loc:      { label: 'Current Location',       get: function (r) { return r.loc || '(blank)'; } },
    mmReason: { label: 'MM liability reason',    get: function (r) { return r.mmReason || '(none)'; } },
    lmClass:  { label: 'LM classification',      get: function (r) { return lmBucket(r); } },
    lmColl:   { label: 'LM collated bucket',     get: function (r) { return r.lmColl; } },
    ageBucket:{ label: 'Ageing bucket',          get: function (r) { return ageBucket(r.age); } },
    ageBand:  { label: 'Ageing (20+ bucketed)', get: function (r) { return ageBand(r.age); } },
    age:      { label: 'Ageing (exact)',         get: function (r) { return r.age === null ? '(blank)' : String(r.age); } },
    mcode:    { label: 'Manifest Code',          get: function (r) { return r.mcode || '(blank)'; } },
    amid:     { label: 'Actual Manifest ID',     get: function (r) { return r.amid || '(blank)'; } },
    origin:   { label: 'Manifest Origin',        get: function (r) { return r.origin || '(blank)'; } },
    dest:     { label: 'Manifest Destination',   get: function (r) { return r.dest || '(blank)'; } },
    lane:     { label: 'Lane Code',              get: function (r) { return r.lane || '(blank)'; } },
    tert:     { label: 'Tertiary Lane',          get: function (r) { return r.tert || '(none - zonal)'; } },
    bag:      { label: 'Connecting Bagging',     get: function (r) { return r.bag || '(not recorded)'; } },
    mmRemarks:{ label: 'MM Remarks',             get: function (r) { return r.mm || '(blank)'; } },
    lmRemarks:{ label: 'LM Remarks',             get: function (r) { return r.lm || '(blank)'; } },
    landroval:{ label: 'Landroval Check',        get: function (r) { return r.land || '(blank)'; } },
    hov:      { label: 'HOV status',             get: function (r) { return r.hov ? 'HOV' : 'NON HOV'; } },
    pname:    { label: 'Product Name',           get: function (r) { return r.pname || '(blank)'; } },
    pcat:     { label: 'Product Category',       get: function (r) { return r.pcat || '(blank)'; } },
    wrongDest:{ label: 'Wrongly connected destination', get: function (r) { return r.wrongDest || 'NA'; } },
    bucket:   { label: 'MM liability bucket',    get: function (r) { return mmBucketOf(r); } },
    mmColl:   { label: 'MM collated bucket',     get: function (r) { return r.mmColl; } },
    pod:      { label: 'POD Mapping',            get: function (r) { return r.pod || 'NA'; } },
    podZone:  { label: 'POD_Zone',               get: function (r) { return r.podZone || 'NA'; } },
    seller:   { label: 'Seller name',            get: function (r) { return r.seller || 'NA'; } },
    hov2:     { label: 'HOV2 status',            get: function (r) { return r.hov2 ? 'HOV' : 'NON HOV'; } },
    dcRemark: { label: 'DC remark',              get: function (r) { return r.dcRemark || 'NA'; } },
    actionUser:{ label: 'Action user',           get: function (r) { return r.actionUser || '(blank)'; } },
    region:   { label: 'Current location region', get: function (r) { return r.region || '(blank)'; } }
  };

  function countBy(rows, fn) {
    var m = {}; rows.forEach(function (r) { var k = fn(r); m[k] = (m[k] || 0) + 1; }); return m;
  }

  function pivot(rows, keys) {
    var map = new Map();

      var kv = keys.map(function (k) { return KEYS[k].get(r); });
      var id = kv.join('\u001f');
      var g = map.get(id);
      if (!g) { g = { keys: kv, rows: [], awb: new Set(), mani: new Set(), value: 0, hovCount: 0, hovValue: 0, buckets: {} }; map.set(id, g); }
      g.rows.push(r); g.awb.add(r.awb); g.mani.add(r.mcode); g.value += r.value;
      if (r.hov) { g.hovCount++; g.hovValue += r.value; }

    });
    return Array.from(map.values()).map(function (g) {
      return { keys: g.keys, rows: g.rows, pendency: g.rows.length, uniqueAwb: g.awb.size, manifests: g.mani.size, value: g.value, hovCount: g.hovCount, hovValue: g.hovValue, buckets: g.buckets };
    });
  }

  function summary(rows) {
    var awb = new Set(rows.map(function (r) { return r.awb; }));
    var mani = new Set(rows.map(function (r) { return r.mcode; }));
    var dests = new Set(rows.map(function (r) { return r.dest; }));
    var origins = new Set(rows.map(function (r) { return r.origin; }));
    var hov = rows.filter(function (r) { return r.hov; });
    var buckets = {}; BUCKETS.forEach(function (b) { buckets[b] = { n: 0, value: 0 }; });
    rows.forEach(function (r) { var b = ageBucket(r.age); if (buckets[b]) { buckets[b].n++; buckets[b].value += r.value; } });
    return {
      pendency: rows.length, uniqueAwb: awb.size, manifests: mani.size, destinations: dests.size, origins: origins.size,
      value: rows.reduce(function (s, r) { return s + r.value; }, 0),
      hovCount: hov.length, hovValue: hov.reduce(function (s, r) { return s + r.value; }, 0),
      buckets: buckets
    };
  }

  // ---------- Lane analysis (LH tab) ----------
  function analyzeLanes(rows) {
    var groups = new Map();
    rows.forEach(function (r) { if (!r.lane) return; if (!groups.has(r.lane)) groups.set(r.lane, []); groups.get(r.lane).push(r); });
    var lanes = [];
    groups.forEach(function (rs, lane) {
      var pend = rs.length;
      var validated = rs.filter(function (r) { return r.lmShort; }).length;
      var destCounts = countBy(rs, function (r) { return r.dest || '(blank)'; });
      var destSorted = Object.keys(destCounts).sort(function (a, b) { return destCounts[b] - destCounts[a]; });
      var topDest = destSorted[0], topDestShare = destCounts[topDest] / pend;
      var bagCounts = countBy(rs.filter(function (r) { return r.bag; }), function (r) { return r.bag; });
      var bagSorted = Object.keys(bagCounts).sort(function (a, b) { return bagCounts[b] - bagCounts[a]; });
      var domBag = bagSorted[0] || '(not recorded)';
      var domBagCount = bagCounts[domBag] || 0;
      var domBagShare = domBagCount / pend;
      var tertRows = rs.filter(function (r) { return r.tert; });
      var tertCounts = countBy(tertRows, function (r) { return r.tert; });
      var tertSorted = Object.keys(tertCounts).sort(function (a, b) { return tertCounts[b] - tertCounts[a]; });
      var scope = tertRows.length ? 'Tertiary' : 'Zonal';
      var domTert = tertSorted[0] || '', domTertShare = domTert ? tertCounts[domTert] / tertRows.length : 0;
      var tertDominant = scope === 'Tertiary' && tertSorted.length >= 2 && domTertShare >= CONFIG.tertiaryDominanceShare;
      var lmBlank = rs.filter(function (r) { return r.lmBlank; }).length;
      var value = rs.reduce(function (s, r) { return s + r.value; }, 0);
      var hov = rs.filter(function (r) { return r.hov; });
      var jitFlag = bagSorted.length >= 2 && pend >= CONFIG.minLaneAwbs && domBagShare >= CONFIG.jitShareThreshold && domBagCount >= CONFIG.jitMinBagAwbs;
      var broadFlag = pend >= CONFIG.minLaneAwbs && destSorted.length >= CONFIG.broadMinDestinations && topDestShare <= CONFIG.broadMaxTopDestShare;
      // Fewer than confirmMinValidated shorts in the whole lane is too thin to call a lane confirmed;
      // those lanes carry evidence but drop to Possible.
      var partialValidated = validated > 0 && validated < CONFIG.confirmMinValidated;
      var category;
      if (validated >= CONFIG.confirmMinValidated) category = 'Confirm Lane Issue';
      else if (partialValidated) category = 'Possible Lane Issue';
      else if (jitFlag) category = 'Possible JIT/ADC Issue';
      else if (broadFlag) category = 'Possible Lane Issue';
      else category = 'No pattern flagged';
      var missingRemarksFlag = pend >= CONFIG.minLaneAwbs && validated === 0 && lmBlank / pend >= 0.5;
      var curLocs = countBy(rs, function (r) { return r.loc || '(blank)'; });
      lanes.push({
        lane: lane, scope: scope, pendency: pend, uniqueAwb: new Set(rs.map(function (r) { return r.awb; })).size,
        value: value, validated: validated, destinations: destSorted.length, topDest: topDest, topDestShare: topDestShare,
        domBag: domBag, domBagCount: domBagCount, domBagShare: domBagShare,
        domTert: domTert, domTertShare: domTertShare, tertDistinct: tertSorted.length,
        tertDominant: tertDominant, jitFlag: jitFlag, broadFlag: broadFlag, missingRemarksFlag: missingRemarksFlag,
        partialValidated: partialValidated, confirmRank: 0, topConfirm: false,
        valueFlag: value > CONFIG.laneValueThreshold, lmBlank: lmBlank,
        hovCount: hov.length, hovValue: hov.reduce(function (s, r) { return s + r.value; }, 0),
        locations: Object.keys(curLocs).length, topLocations: Object.keys(curLocs).sort(function (a, b) { return curLocs[b] - curLocs[a]; }).slice(0, 3),
        buckets: (function () { var b = {}; BUCKETS.forEach(function (k) { b[k] = 0; }); rs.forEach(function (r) { var k = ageBucket(r.age); if (b[k] !== undefined) b[k]++; }); return b; })(),
        category: category, rows: rs
      });
    });
    lanes.sort(function (a, b) { return b.value - a.value; });
    // Only lanes that pass the confirm test are reported at all. They rank by pendency:
    // the top slice stays Confirm, the next band reads Possible, the rest are not flagged.
    var confirmed = lanes.filter(function (l) { return l.category === 'Confirm Lane Issue'; })
      .sort(function (a, b) { return b.pendency - a.pendency; });
    lanes.forEach(function (l) { l.category = 'Not flagged for Lane'; l.confirmRank = 0; l.topConfirm = false; });
    confirmed.forEach(function (l, i) {
      l.confirmRank = i + 1;
      l.topConfirm = i < CONFIG.confirmHighlightTop;
      if (i < CONFIG.confirmHighlightTop) l.category = 'Confirm Lane Issue';
      else if (i < CONFIG.confirmShowMax) l.category = 'Possible Lane Issue';
    });
    return lanes;

  // ---------- tab: MM Liability ----------

      }).join('') + '<span class="meta">None ticked = all PODs.</span></div>';

    function hubStats(rs, label, pod) {
      var high = rs.filter(function (r) { return r.age !== null && r.age >= LM_HIGH_AGE; });
      var byAge = {}; rs.forEach(function (r) { if (r.age !== null) byAge[r.age] = (byAge[r.age] || 0) + 1; });
      var earlyMax = 0, highMax = 0, highDay = '';

      var thin = Object.keys(perMani).filter(function (m) { return perMani[m] <= LM_SMALL_DIFF; }).length;
      var hov2 = rs.filter(function (r) { return r.hov2; }).length;
      var why = [];

               value: rs.reduce(function (a, r) { return a + r.value; }, 0),

  // ---------- tab: DC-DC ----------
  function sellerRows(rows) {
    var g = new Map();

      var k = r.seller; if (!g.has(k)) g.set(k, { seller: k, n: 0, value: 0, aged: 0, liquid: false });

  // ---------- body ----------

  function renderPivot() {

    // Area filters apply on top of the tab's own filters.
    (pv.filters || []).forEach(function (fn) {
      var pick = pv.fsel[fn];
      if (!pick) return;
      var f = pvField(fn);
      rows = rows.filter(function (r) { return pvVal(f, r) === pick; });
    });
    var rowFs = (pv.rows || []).map(pvField).filter(Boolean);
    var colFs = (pv.cols || []).map(pvField).filter(Boolean);
    if (!rowFs.length) rowFs = [pvField('Current_location')].filter(Boolean);
    var val = pv.vals[0] || 'awb', money = val === 'value';
    var pick = function (c) {

    };
    var G = new Map(), colSet = {};
    rows.forEach(function (r) {
      var keys = rowFs.map(function (f) { return pvVal(f, r); });
      var kk = keys.join('\u001f');

      if (!g) { g = { keys: keys, cells: {}, tot: { n: 0, v: 0, h: 0, m: {} } }; G.set(kk, g); }
      var ck = colFs.length ? colFs.map(function (f) { return pvVal(f, r); }).join(' · ') : '*';
      colSet[ck] = 1;
      var c = g.cells[ck] || (g.cells[ck] = { n: 0, v: 0, h: 0, m: {} });
      c.n++; c.v += r.value; if (r.hov) c.h++; c.m[r.mcode] = 1;
      g.tot.n++; g.tot.v += r.value; if (r.hov) g.tot.h++; g.tot.m[r.mcode] = 1;
    });
    var colKeys = Object.keys(colSet).sort(function (a, b) {

    var cdefs = rowFs.map(function (f, i) { return { h: f.name, v: function (x) { return x.keys[i]; } }; });

  // Tab-separated text, so a paste lands in Excel as proper columns.
  function copyTable(id, btn) {
    var rows = TCACHE[id] || [], cols = (TOPTS[id] || {}).cols || [];
    if (!rows.length || !cols.length) return;
    var use = cols.filter(function (c) { return !c.rca; });

    var lines = [use.map(function (c) { return clean(c.h); }).join('\t')];
    rows.forEach(function (r) { lines.push(use.map(function (c) { return clean(c.v ? c.v(r) : ''); }).join('\t')); });
    var text = lines.join('\r\n');
    var done = function (msg) { if (btn) { var o = btn.textContent; btn.textContent = msg; setTimeout(function () { btn.textContent = o; }, 1600); } };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done('Copied — paste into Excel'); }, function () { fallbackCopy(text, done); });
    } else fallbackCopy(text, done);

  function fallbackCopy(text, done) {

    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false;

  function tableCsv(id) {

    var ccKeys = {}; rows.forEach(function (o) { if (o.cc) Object.keys(o.cc).forEach(function (k) { ccKeys[k] = 1; }); });
    Object.keys(ccKeys).sort(function (x, y) { var nx = parseFloat(x), ny = parseFloat(y); return (isNaN(nx) || isNaN(ny)) ? String(x).localeCompare(String(y)) : nx - ny; })
      .forEach(function (k) { cols.push({ h: (money ? 'Value_' : 'Count_') + k, get: function (o) { return ((money ? o.cv : o.cc) || {})[k] || 0; } }); });

  // Measure rendered cells and give each column its own width, capped so the first column

  // ---------- events ----------
  var rzDrag = null, rzMoved = false;
  function bind() {
    document.addEventListener('mousedown', function (ev) {
      var h = ev.target.closest && ev.target.closest('.rz'); if (!h) return;
      var th = h.parentElement;
      rzDrag = { id: h.dataset.rz, i: +h.dataset.i, th: th, table: th.closest('table'), x: ev.clientX, w: th.offsetWidth };
      rzMoved = false; document.body.classList.add('resizing'); ev.preventDefault(); ev.stopPropagation();
    });

      if (!rzDrag) return;
      var w = Math.max(50, rzDrag.w + ev.clientX - rzDrag.x); rzMoved = true;

      var setW = function (el) { if (!el) return; el.classList.remove('capfirst'); el.style.width = px; el.style.minWidth = px; el.style.maxWidth = px; };

      var act = el.getAttribute('data-act');
      if (el.tagName === 'INPUT' && el.type === 'checkbox') return;
      if (act === 'tab') { closePopup(); state.tab = el.dataset.tab; state.openFilter = null; renderAll(); }
      else if (act === 'fopen') { state.openFilter = state.openFilter === el.dataset.field ? null : el.dataset.field; state.filterSearch = ''; renderFilters(); ev.stopPropagation(); }
      else if (act === 'fall' || act === 'fnone') {
        var s = state.tabs[state.tab], f = el.dataset.field;
        if (act === 'fnone') delete s.fields[f];
        else { var q = state.filterSearch.toLowerCase(); s.fields[f] = new Set(filterOptions(state.tab, f, computeView(state.tab)).filter(function (o) { return !q || o.v.toLowerCase().indexOf(q) >= 0; }).slice(0, 300).map(function (o) { return o.v; })); }
        renderFilters(); renderBody();
      }
      else if (act === 'resetdef') { var d = C.tabs[state.tab]; Object.assign(state.tabs[state.tab], { manifestType: d.manifestType, ageMin: d.ageMin, ageMax: d.ageMax }); renderFilters(); renderBody(); }

      else if (act === 'pvmove') {
        var pv = state.pivot, ar = pv[el.dataset.area], i = ar.indexOf(el.dataset.name), j = i + (+el.dataset.dir);
        if (i >= 0 && j >= 0 && j < ar.length) { ar.splice(j, 0, ar.splice(i, 1)[0]); renderAll(); }
      }

        var nowOpen = sec ? sec.classList.contains('closed') : true;
        state.openSec[sid] = nowOpen;
        if (sec) { sec.classList.toggle('closed', !nowOpen); var cr = sec.querySelector('.caret'); if (cr) cr.innerHTML = nowOpen ? '&#9662;' : '&#9656;'; }
      }
      else if (act === 'openall' || act === 'closeall') {
        var want = act === 'openall';
        Array.prototype.forEach.call(document.querySelectorAll('section.card[data-sec]'), function (sec) { state.openSec[sec.dataset.sec] = want; });
        renderBody();
      }
      else if (act === 'metric') { state.tblMetric[el.dataset.table] = el.dataset.val; renderBody(); }
      else if (act === 'fields') { state.showFields = !state.showFields; renderAll(); }
      else if (act === 'backend') { state.showBackend = !state.showBackend; renderHeader(); }
      else if (act === 'pull') { if (window.SYNC && window.SYNC.configured()) pullFromSheet(); else { state.showBackend = true; renderHeader(); } }
      else if (act === 'apisave') {
        var inp = document.getElementById('apiurl');
        window.SYNC.setUrl(inp ? inp.value : '');
        state.backendErr = ''; state.backend = 'Testing the backend …'; renderHeader();
        window.SYNC.ping().then(function (r) {
          state.backend = ''; state.showBackend = false;
          state.notice = 'Backend connected. Writing to tab "' + r.sheet + '".'; renderAll();
          return pullFromSheet();
        }).catch(function (e) { state.backend = ''; state.backendErr = 'Backend test failed: ' + e.message; renderHeader(); });
      }
    });
    document.addEventListener('change', function (ev) {
      var el = ev.target, act = el.getAttribute && el.getAttribute('data-act');
      if (act === 'ftoggle') {
        var s = state.tabs[state.tab], f = el.dataset.field, v = el.dataset.val;
        if (!s.fields[f]) s.fields[f] = new Set();
        if (el.checked) s.fields[f].add(v); else s.fields[f].delete(v);
        if (!s.fields[f].size) delete s.fields[f];
        renderFilters(); renderBody();
      }
      else if (act === 'pdim') { state.prodDim = el.dataset.val; renderBody(); }
      else if (act === 'tblmt') { state.tblMT[el.dataset.table] = el.dataset.val; renderBody(); }
      else if (act === 'missdim') { state.missDim = el.dataset.val; renderBody(); }
      else if (act === 'podpick') {
        if (!state.podPick) state.podPick = new Set();
        if (el.checked) state.podPick.add(el.dataset.val); else state.podPick.delete(el.dataset.val);
        if (!state.podPick.size) state.podPick = null;
        renderBody();
      }
      else if (act === 'subtoggle') { var m = state[el.dataset.group]; if (!m[state.tab]) m[state.tab] = new Set(); if (el.checked) m[state.tab].add(el.dataset.val); else m[state.tab].delete(el.dataset.val); renderBody(); }
      else if (act === 'fwdregion') { state.fwdRegion = el.value; state.fwdLoc = null; renderBody(); }
      else if (act === 'fwdloc') {
        if (!state.fwdLoc) state.fwdLoc = new Set();
        if (el.checked) state.fwdLoc.add(el.dataset.val); else state.fwdLoc.delete(el.dataset.val);
        if (!state.fwdLoc.size) state.fwdLoc = null;
        renderBody();
      }
      else if (act === 'pvscope') { state.pivot.scope = el.value; renderAll(); }
      else if (act === 'pvval') { state.pivot.vals = [el.value]; renderAll(); }
      else if (act === 'pvfsel') { state.pivot.fsel[el.dataset.name] = el.value; renderBody(); }
      else if (act === 'pvpick') {
        var nm = el.dataset.name;
        if (el.checked) { if (!pvUsed(nm)) state.pivot.rows.push(nm); } else pvRemove(nm);
        renderAll();
      }
      else if (act === 'mt') { state.tabs[state.tab].manifestType = el.value; renderFilters(); renderBody(); }
      else if (act === 'age') { state.tabs[state.tab][el.dataset.k] = el.value === '' ? null : +el.value; renderFilters(); renderBody(); }
      else if (act === 'val') { state.tabs[state.tab][el.dataset.k] = el.value === '' ? null : +el.value; renderBody(); }
      else if (el.id === 'upload' && el.files && el.files[0]) { var file = el.files[0]; el.value = ''; onUpload(file); }
    });
    document.addEventListener('input', function (ev) {
      var el = ev.target, act = el.getAttribute && el.getAttribute('data-act');
      if (act === 'search') { state.tabs[state.tab].search = el.value; renderBody(); }
      else if (act === 'pvsearch') {
        state.pivot.search = el.value; renderHeader();
        var pi = document.querySelector('.pvsearch'); if (pi) { pi.focus(); pi.setSelectionRange(el.value.length, el.value.length); }
      }
      else if (act === 'laneq') {
        state.laneQ = el.value; renderBody();
        var li = document.querySelector('.lanesearch'); if (li) { li.focus(); li.setSelectionRange(el.value.length, el.value.length); }
      }
      else if (act === 'fsearch') { state.filterSearch = el.value; renderFilters(); var inp = document.querySelector('.fsearch'); if (inp) { inp.focus(); inp.setSelectionRange(el.value.length, el.value.length); } }
    });
    document.addEventListener('focusout', function (ev) { var el = ev.target; if (el.getAttribute && el.getAttribute('data-act') === 'remark') saveRemark(el.dataset.key, el.value); });
    // Typing in an RCA box must not trigger a re-render, or the box would lose focus mid-word.
    document.addEventListener('keydown', function (ev) { if (ev.target && ev.target.classList && ev.target.classList.contains('remark') && ev.key === 'Escape') { ev.stopPropagation(); ev.target.blur(); } }, true);
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { if (state.popup) closePopup(); state.openFilter = null; renderFilters(); }
    });
    $('#modal').addEventListener('click', function (ev) { if (ev.target.id === 'modal') closePopup(); });
  }

  function boot() {
    bind(); renderAll();
    loadActive().then(function () {
      renderAll();
      remarkAll().then(function (all) { all.forEach(function (e) { state.remarks.set(e.key, e); }); renderBody(); }).catch(function () {});
      setInterval(expireIfNeeded, 60 * 1000);
      if (window.SYNC && window.SYNC.configured()) {
        window.SYNC.loadRca().then(function (notes) {
          Object.keys(notes).forEach(function (k) { state.remarks.set(k, { key: k, entity: 'rca', ref: k.slice(2), text: notes[k], history: [], matched: true }); });
          renderBody();
        }).catch(function () {});
        if (!activeDs()) return pullFromSheet();
      }
    });
  }

  // Load the base that is already in the Google Sheet (what teammates and other devices see).
  function pullFromSheet() {
    state.backendErr = ''; state.backend = 'Checking the Google Sheet …'; renderHeader();
    return window.SYNC.pullDataset(function (msg) { state.backend = msg; renderHeader(); })
      .then(function (ds) {
        state.backend = '';
        if (!ds) { state.notice = 'The Google Sheet has no base yet. Upload a file to fill it.'; renderAll(); return; }
        state.ds = ds; state.records = ds.records; state.expiredAt = null;
        kvPut('active', ds).catch(function () {});
        state.notice = 'Loaded ' + num(ds.records.length) + ' records from the Google Sheet (' + ds.headers.length + ' columns).';
        renderAll();
      })
      .catch(function (e) { state.backend = ''; state.backendErr = 'Could not read the Google Sheet: ' + e.message; renderAll(); });
  }
  window.DASH = {
    schema: DS_SCHEMA,
    backendError: function (m) { state.backendErr = m; renderHeader(); }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
